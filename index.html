<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=no">
    <title>小鲁班 - 智能助手</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 主题变量（浅色默认）- 恢复第一版大小比例 */
        :root {
            --bg-app: white;
            --bg-chat: #f8fafc;
            --bg-header: #1e293b;
            --text-header: white;
            --bubble-user-bg: rgba(30, 41, 59, 0.85);
            --bubble-user-text: white;
            --bubble-assistant-bg: rgba(255, 255, 255, 0.85);
            --bubble-assistant-text: #0f172a;
            --thinking-bg: rgba(255, 251, 235, 0.9);
            --thinking-header-bg: rgba(254, 243, 199, 0.9);
            --thinking-text: #78350f;
            --input-bg: #f1f5f9;
            --input-text: #334155;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0,0,0,0.05);
            --accent: #3b82f6;
            /* 表格优化样式变量 */
            --table-header-bg: #e2e8f0;
            --table-row-alt: #f1f5f9;
            --table-border: #cbd5e1;
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-app: #0f172a;
            --bg-chat: #1e293b;
            --bg-header: #0f172a;
            --text-header: #f1f5f9;
            --bubble-user-bg: rgba(59, 130, 246, 0.8);
            --bubble-user-text: white;
            --bubble-assistant-bg: rgba(30, 41, 59, 0.85);
            --bubble-assistant-text: #e2e8f0;
            --thinking-bg: rgba(30, 41, 59, 0.9);
            --thinking-header-bg: rgba(51, 65, 85, 0.9);
            --thinking-text: #fde68a;
            --input-bg: #334155;
            --input-text: #f1f5f9;
            --border-color: #334155;
            --shadow-color: rgba(0,0,0,0.3);
            --accent: #60a5fa;
            --table-header-bg: #334155;
            --table-row-alt: #1e293b;
            --table-border: #475569;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f2f5;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100%;
            transition: background 0.2s;
        }

        /* 恢复第一版主体宽度 max-width:500px */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100%;
            background: var(--bg-app);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-chat);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .chat-area.has-bg {
            background-color: transparent;
            background-blend-mode: normal;
            background-image: linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)), var(--bg-image);
        }
        [data-theme="dark"] .chat-area.has-bg {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image);
        }
        .chat-area > * {
            position: relative;
            z-index: 1;
        }

        /* 气泡样式（第一版尺寸） */
        .message {
            display: flex;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }
        .message.user {
            align-self: flex-end;
            justify-content: flex-end;
        }
        .message.assistant {
            align-self: flex-start;
            flex-direction: column;
            max-width: 90%;
        }
        .bubble {
            padding: 12px 18px;
            border-radius: 28px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            backdrop-filter: blur(4px);
            transition: transform 0.1s ease;
            box-shadow: 0 4px 12px var(--shadow-color);
            white-space: pre-wrap;
        }
        .user .bubble {
            background: var(--bubble-user-bg);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .assistant .bubble {
            background: var(--bubble-assistant-bg);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--bubble-assistant-text);
            border-bottom-left-radius: 6px;
        }

        /* 表格优化样式（保留完整功能） */
        .assistant .bubble table,
        .final-answer table,
        .thinking-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.85rem;
            display: block;
            overflow-x: auto;
            border-radius: 12px;
            border-style: hidden;
            box-shadow: 0 0 0 1px var(--table-border);
        }
        .assistant .bubble th,
        .final-answer th,
        .thinking-content th {
            background: var(--table-header-bg);
            color: var(--bubble-assistant-text);
            padding: 10px 8px;
            border: 1px solid var(--table-border);
            font-weight: 600;
            text-align: left;
        }
        .assistant .bubble td,
        .final-answer td,
        .thinking-content td {
            padding: 8px;
            border: 1px solid var(--table-border);
            text-align: left;
        }
        .assistant .bubble tr:nth-child(even),
        .final-answer tr:nth-child(even),
        .thinking-content tr:nth-child(even) {
            background-color: var(--table-row-alt);
        }
        .assistant .bubble tr:hover,
        .final-answer tr:hover,
        .thinking-content tr:hover {
            background-color: rgba(128,128,128,0.1);
        }

        /* 消息计数条 */
        .message-count-bar {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-chat);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        [data-theme="dark"] .message-count-bar {
            color: #64748b;
        }

        /* 自定义 tooltip */
        .custom-tooltip {
            position: fixed;
            background: rgba(30, 41, 59, 0.92);
            color: #f1f5f9;
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 9999;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .custom-tooltip.visible {
            opacity: 1;
        }
        [data-theme="dark"] .custom-tooltip {
            background: rgba(226, 232, 240, 0.92);
            color: #1e293b;
        }

        /* 思考块样式（第一版） */
        .thinking-block {
            margin-bottom: 10px;
            border-left: 4px solid #f59e0b;
            background: var(--thinking-bg);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .thinking-header {
            padding: 10px 14px;
            background: var(--thinking-header-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #92400e;
            font-weight: 500;
        }
        .thinking-header .thinking-timer {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f59e0b;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .thinking-content {
            padding: 12px 14px;
            font-size: 0.85rem;
            color: var(--thinking-text);
            background: var(--thinking-bg);
            border-top: 1px solid #fde68a;
            white-space: pre-wrap;
            display: block;
        }
        .thinking-content.collapsed {
            display: none;
        }
        .final-answer {
            margin-top: 6px;
        }

        /* 业务按钮组（第一版风格，共5个） */
        .business-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 8px 0 4px 0;
            justify-content: flex-start;
        }
        .business-btn {
            background: rgba(224, 231, 255, 0.8);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .business-btn:hover {
            background: rgba(199, 210, 254, 0.9);
            transform: translateY(-1px);
        }

        /* 附件区域（多文件）第一版风格 */
        .attachments-area {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .attachment-item {
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--input-text);
            backdrop-filter: blur(4px);
        }
        .attachment-item .remove-attachment {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 2px;
        }
        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 16px;
            margin-top: 8px;
            margin-bottom: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--input-text);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%,60%,100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* 输入栏第一版样式 */
        .input-bar {
            background: var(--bg-app);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            margin-bottom: env(safe-area-inset-bottom);
        }
        .action-btn {
            background: var(--input-bg);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--input-text);
            flex-shrink: 0;
        }
        .action-btn:active {
            background: var(--border-color);
            transform: scale(0.95);
        }
        .action-btn.recording {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4);}
            70% { box-shadow: 0 0 0 8px rgba(239,68,68,0);}
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0);}
        }
        .text-input {
            flex: 1;
            background: var(--input-bg);
            border: none;
            padding: 12px 16px;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            min-width: 0;
            transition: all 0.2s;
            color: var(--input-text);
        }
        .text-input:focus {
            background: var(--bg-app);
            box-shadow: 0 0 0 2px var(--accent);
        }
        .send-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .send-btn:active {
            transform: scale(0.95);
        }

        .plus-menu {
            position: absolute;
            bottom: 70px;
            left: 16px;
            background: var(--bg-app);
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            z-index: 100;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }
        .plus-menu button {
            background: var(--input-bg);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--input-text);
        }
        .plus-menu button:active {
            background: var(--border-color);
            transform: scale(0.95);
        }
        .plus-menu.hidden {
            display: none;
        }

        /* 头部样式（第一版） */
        .header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(51,65,85,0.5);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-area {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.2s;
        }
        .icon-area:active {
            background: rgba(255,255,255,0.2);
        }
        .settings-btn, .user-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 24px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .settings-btn:active, .user-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: white;
        }

        /* 权限提示 */
        .permission-banner {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 10px 16px;
            margin: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #92400e;
        }
        .permission-banner button {
            background: #f59e0b;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 模态框样式（第一版） */
        .auth-modal, .user-modal, .bg-modal, .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            backdrop-filter: blur(8px);
        }
        .auth-container, .user-modal-content, .bg-modal-content, .modal-content {
            background: var(--bg-app);
            width: 90%;
            max-width: 380px;
            border-radius: 32px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            color: var(--bubble-assistant-text);
        }
        .auth-container input, .bg-modal-content input, .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .auth-container input:focus, .bg-modal-content input:focus, .modal-content input:focus {
            border-color: var(--accent);
        }
        .auth-container button, .modal-content button, .bg-modal-content button, .user-modal-content button {
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .save-btn, .auth-login-btn, .auth-register-btn, .set-bg-btn {
            background: var(--accent);
            color: white;
        }
        .close-btn, .close-modal, .close-bg-btn, .close-user-btn {
            background: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
        }
        .logout-btn, .remove-bg-btn {
            background: #ef4444;
            color: white;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .button-group button {
            flex: 1;
            margin-top: 0;
        }
        .theme-option {
            padding: 10px;
            margin: 8px 0;
            border-radius: 40px;
            cursor: pointer;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .theme-option:hover {
            background: var(--border-color);
        }
        .bg-preview {
            width: 100%;
            height: 150px;
            border-radius: 20px;
            margin-bottom: 16px;
            background: var(--input-bg);
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border-color);
        }
        .user-detail {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }
        .user-detail div {
            margin-bottom: 8px;
        }
        .user-detail strong {
            display: inline-block;
            width: 70px;
        }
        .scanner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scanner-container {
            width: 80%;
            max-width: 350px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
        }
        #qr-reader {
            width: 100%;
            background: #000;
        }
        .scanner-controls {
            margin-top: 20px;
        }
        .scanner-controls button {
            background: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container" id="app" style="display: none;">
    <div class="header">
        <div class="icon-area" id="bgSettingsBtn"><h1>🌏 小鲁班</h1></div>
        <div class="user-info">
            <div class="user-avatar" id="userMenuBtn" style="cursor:pointer;" title="个人中心" data-tip="个人中心">👤</div>
            <button class="settings-btn" id="clearChatBtn" title="清空对话" data-tip="清空对话">🗑️</button>
            <button class="settings-btn" id="exportChatBtn" title="导出记录" data-tip="导出记录">📤</button>
            <button class="settings-btn" id="openSettingsBtn" title="设置" data-tip="设置">️</button>
            <button class="settings-btn" id="themeToggleBtn" title="切换主题" data-tip="切换主题">🎨</button>
        </div>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="message-count-bar" id="messageCountBar">共 0 条消息</div>
        <div class="message assistant">
            <div class="bubble">
                👋 <span id="welcomeUser"></span>
                <div class="business-buttons">
                    <div class="business-btn" data-type="设备维修咨询">🔧 设备维修</div>
                    <div class="business-btn" data-type="资产信息查询">📦 资产查询</div>
                    <div class="business-btn" data-type="流程制度查询">📋 流程制度</div>
                    <div class="business-btn" data-type="巡检计划优化">📅 巡检计划</div>
                    <div class="business-btn" data-type="备件库存健康度与预算报告">📊 库存预算</div>
                </div>
            </div>
        </div>
    </div>
    <div class="input-bar">
        <button class="action-btn" id="voiceBtn" data-tip="语音输入">🎙️</button>
        <button class="action-btn" id="plusBtn" data-tip="更多功能">➕</button>
        <input type="text" class="text-input" id="textInput" placeholder="问点什么..." autocomplete="off">
        <button class="send-btn" id="sendBtn" data-tip="发送">➤</button>
        <div id="plusMenu" class="plus-menu hidden">
            <button id="cameraMenuBtn" data-tip="拍照">📷</button>
            <button id="fileMenuBtn" data-tip="上传文件">📎</button>

<script>
    (function() {
        // ========== 用户系统 (完全保留第一版逻辑) ==========
        let currentUser = null;
        let permissionStatus = { mic: false, cam: false };
        function getUsers() { const u = localStorage.getItem('dify_users'); return u ? JSON.parse(u) : {}; }
        function saveUsers(u) { localStorage.setItem('dify_users', JSON.stringify(u)); }
        function registerUser(u,p) { const users=getUsers(); if(users[u]) return {success:false,message:'用户名已存在'}; if(u.length<2) return {success:false,message:'用户名至少2个字符'}; if(p.length<3) return {success:false,message:'密码至少3个字符'}; users[u]={password:p,regTime:new Date().toLocaleString(),avatar:u[0].toUpperCase()}; saveUsers(users); return {success:true}; }
        function loginUser(u,p) { const users=getUsers(); const user=users[u]; if(!user) return {success:false,message:'用户不存在'}; if(user.password!==p) return {success:false,message:'密码错误'}; return {success:true,user:{username:u,...user}}; }
        function logout() { currentUser=null; localStorage.removeItem('dify_current_user'); showAuthModal(); document.getElementById('app').style.display='none'; }
        function loadCurrentUser() { const saved=localStorage.getItem('dify_current_user'); if(saved){ try{ const u=JSON.parse(saved); const users=getUsers(); if(users[u.username] && users[u.username].password===u.password) { currentUser={username:u.username,...users[u.username]}; return true; } }catch(e){} } return false; }
        function saveCurrentUser() { if(currentUser) localStorage.setItem('dify_current_user',JSON.stringify({username:currentUser.username,password:currentUser.password})); }
        function updateUserUI() { if(currentUser){ document.getElementById('userMenuBtn').textContent=currentUser.avatar||currentUser.username[0].toUpperCase(); document.getElementById('welcomeUser').textContent='你好，'+currentUser.username; document.getElementById('app').style.display='flex'; document.getElementById('authModal').style.display='none'; } }
        function showUserModal() { if(!currentUser) return; document.getElementById('userDetailName').textContent=currentUser.username; document.getElementById('userRegTime').textContent=currentUser.regTime||'未知'; document.getElementById('userModal').style.display='flex'; }
        let isLoginMode=true;
        function showAuthModal() { document.getElementById('authModal').style.display='flex'; document.getElementById('app').style.display='none'; document.getElementById('authError').textContent=''; document.getElementById('authUsername').value=''; document.getElementById('authPassword').value=''; isLoginMode=true; updateAuthUI(); }
        function updateAuthUI() { const t=document.getElementById('authTitle'), btn=document.getElementById('authSubmitBtn'), sw=document.getElementById('authSwitchBtn'); if(isLoginMode){ t.textContent='登录'; btn.textContent='登录'; btn.className='auth-login-btn'; sw.textContent='还没有账号？立即注册'; } else { t.textContent='注册'; btn.textContent='注册'; btn.className='auth-register-btn'; sw.textContent='已有账号？去登录'; } }
        function handleAuthSubmit() { const u=document.getElementById('authUsername').value.trim(), p=document.getElementById('authPassword').value, err=document.getElementById('authError'); if(isLoginMode){ const r=loginUser(u,p); if(r.success){ currentUser=r.user; saveCurrentUser(); updateUserUI(); document.getElementById('authModal').style.display='none'; loadChatBackground(); requestAllPermissions(); } else err.textContent=r.message; } else { const r=registerUser(u,p); if(r.success){ err.textContent=r.message; err.style.color='#10b981'; setTimeout(()=>{ isLoginMode=true; updateAuthUI(); err.textContent=''; },1500); } else err.textContent=r.message; } }

        async function requestAllPermissions() {
            const banner=document.getElementById('permissionBanner');
            try{
                if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
                    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
                    stream.getTracks().forEach(t=>t.stop());
                    permissionStatus.mic=true;
                    const camStream=await navigator.mediaDevices.getUserMedia({video:true});
                    camStream.getTracks().forEach(t=>t.stop());
                    permissionStatus.cam=true;
                    banner.style.display='none';
                }
            }catch(err){
                permissionStatus.mic=false; permissionStatus.cam=false;
                banner.style.display='flex';
                let msg="麦克风或摄像头权限未授予，部分功能不可用";
                if(err.name==='NotAllowedError') msg="您拒绝了权限请求，请点击重新授权并允许";
                else if(err.name==='NotFoundError') msg="未找到麦克风或摄像头设备";
                banner.querySelector('span').innerText=msg;
            }
        }
        function reRequestPermissions(){ requestAllPermissions(); }

        // ========== 主题切换 (第一版样式) ==========
        let currentTheme = localStorage.getItem('theme') || 'light';
        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('theme', theme);
            if (theme === 'system') {
                const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            } else {
                document.body.setAttribute('data-theme', theme);
            }
        }
        function initTheme() {
            setTheme(currentTheme);
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (currentTheme === 'system') {
                    document.body.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                }
            });
        }
        function showThemeModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>主题选择</h3>
                    <div class="theme-option" data-theme="light">☀️ 浅色模式</div>
                    <div class="theme-option" data-theme="dark">🌙 深色模式</div>
                    <div class="theme-option" data-theme="system">💻 跟随系统</div>
                    <button id="closeThemeModal" class="close-modal">关闭</button>
                </div>
            `;
            document.body.appendChild(modal);
            const options = modal.querySelectorAll('.theme-option');
            options.forEach(opt => {
                if (opt.dataset.theme === currentTheme) opt.style.background = 'var(--accent)';
                opt.addEventListener('click', () => {
                    setTheme(opt.dataset.theme);
                    modal.remove();
                    showError(`✅ 已切换至${opt.innerText}`);
                });
            });
            modal.querySelector('#closeThemeModal').onclick = () => modal.remove();
        }

        // ========== 配置变量 ==========
        let config={apiKey:'',apiEndpoint:'https://api.dify.ai/v1',instructions:''};
        let conversationId=null;
        let attachments = [];
        let currentAbortController = null;
        const chatArea=document.getElementById('chatArea');
        const textInput=document.getElementById('textInput');
        // 表格渲染函数 (增强)
        function escapeHtml(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function linkify(text) { if(!text) return ''; const urlRegex = /https?:\/\/[^\s()（）<>]+/g; return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`); }
        function convertMarkdownTablesToHtml(text) {
            if (!text) return text;
            const lines = text.split('\n');
            let inTable = false, tableRows = [], result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i], trimmed = line.trim();
                const isPipeRow = trimmed.startsWith('|') && trimmed.endsWith('|') && trimmed.includes('|');
                const isSeparator = /^\|[\s\-:|]+\|$/.test(trimmed) && trimmed.includes('-');
                if (isPipeRow && !inTable && !isSeparator) { inTable = true; tableRows = [trimmed]; }
                else if (inTable && isSeparator && tableRows.length === 1) { tableRows.push(trimmed); }
                else if (inTable && isPipeRow && !isSeparator) { tableRows.push(trimmed); }
                else {
                    if (inTable && !isPipeRow && trimmed !== '') { result.push(renderTableFromRows(tableRows)); tableRows = []; inTable = false; result.push(line); }
                    else if (!inTable) result.push(line);
                    else if (inTable && trimmed === '') { result.push(renderTableFromRows(tableRows)); tableRows = []; inTable = false; result.push(''); }
                }
            }
            if (inTable && tableRows.length) result.push(renderTableFromRows(tableRows));
            return result.join('\n');
        }
        function renderTableFromRows(rows) {
            if (rows.length < 2) return rows.join('\n');
            const headerCells = rows[0].split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
            const dataRows = rows.slice(2);
            let html = '<table><thead><tr>';
            headerCells.forEach(cell => { html += `<th>${escapeHtml(cell)}</th>`; });
            html += '</tr></thead><tbody>';
            for (let row of dataRows) {
                const cells = row.split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
                html += '<tr>';
                cells.forEach(cell => { html += `<td>${escapeHtml(cell)}</td>`; });
                html += '</tr>';
            }
            html += '</tbody></table>';
            return html;
        }
        function formatMessageFinal(raw) {
            let withTables = convertMarkdownTablesToHtml(raw);
            let parts = withTables.split(/(<table[\s\S]*?<\/table>)/gi);
            let finalHtml = '';
            for(let part of parts) {
                if(part.startsWith('<table')) finalHtml += part;
                else {
                    let escaped = escapeHtml(part);
                    let withBreaks = escaped.replace(/\n/g, '<br>');
                    finalHtml += linkify(withBreaks);
                }
            }
            return finalHtml;
        }
        function renderAssistantFinal(container, rawText) { container.innerHTML = formatMessageFinal(rawText); }
        
        // 流式调用（含表格优化）
        async function callAndStreamWithThinking(query, files, abortSignal) { /* 完全保留第一版逻辑，仅增强表格渲染 */ 
            if(!config.apiKey) throw new Error('请先配置 Dify API Key');
            const instructionWithThinking=(config.instructions?config.instructions+'\n':'')+
                "请在你的回答中，将推理思考过程放在 `<think>` 和 `</think>` 标签之间，然后再给出最终答案。支持Markdown表格。";
            const url=`${config.apiEndpoint}/chat-messages`;
            const payload={ inputs:{instruction:instructionWithThinking}, query, response_mode:'streaming', conversation_id:conversationId, user:currentUser?.username||'user' };
            if(files && files.length) payload.files = files;
            const res = await fetch(url,{ method:'POST', headers:{'Authorization':`Bearer ${config.apiKey}`,'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:abortSignal });
            if (!res.ok) { const errText = await res.text(); throw new Error(`API错误 (${res.status}): ${errText}`); }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '', fullText = '', inThink = false, thinkingAccum = '', answerAccum = '', hasThinkTag = false;
            let { thinkingContent, finalAnswerDiv, messageDiv, timerSpan } = createAssistantMessageContainer();
            let timerInterval = null, startTime = null;
            function startTimer(){ if(timerInterval) clearInterval(timerInterval); startTime = Date.now(); timerInterval = setInterval(()=>{ if(timerSpan){ let sec=(Date.now()-startTime)/1000; timerSpan.querySelector('.timer-text').textContent=sec.toFixed(1)+'s';}},100);}
            function stopTimer(){ if(timerInterval) clearInterval(timerInterval); if(timerSpan){ let sec=startTime?(Date.now()-startTime)/1000:0; timerSpan.querySelector('.timer-text').textContent=sec.toFixed(1)+'s'; let sp=timerSpan.querySelector('.spinner'); if(sp) sp.style.display='none'; } }
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.event === 'message' && parsed.answer !== undefined) {
                                const chunk = parsed.answer;
                                fullText += chunk;
                                if (!inThink && !hasThinkTag) {
                                    const thinkStart = fullText.indexOf('<think>');
                                    if (thinkStart !== -1) { hasThinkTag = true; inThink = true; startTimer(); const after = fullText.substring(thinkStart+7); const endPos = after.indexOf('</think>');
                                        if (endPos !== -1) { thinkingAccum = after.substring(0,endPos); answerAccum = after.substring(endPos+8); inThink = false; stopTimer(); renderAssistantFinal(thinkingContent,thinkingAccum); renderAssistantFinal(finalAnswerDiv,answerAccum); }
                                        else { thinkingAccum = after; renderAssistantFinal(thinkingContent,thinkingAccum); }
                                    } else { answerAccum += chunk; renderAssistantFinal(finalAnswerDiv,answerAccum); }
                                } else if (inThink) {
                                    const endPos = fullText.indexOf('</think>', fullText.length - chunk.length - 20);
                                    if (endPos !== -1) { const thinkText = fullText.substring(fullText.indexOf('<think>')+7, endPos); thinkingAccum = thinkText; answerAccum = fullText.substring(endPos+8); inThink = false; stopTimer(); renderAssistantFinal(thinkingContent,thinkingAccum); renderAssistantFinal(finalAnswerDiv,answerAccum); }
                                    else { thinkingAccum += chunk; renderAssistantFinal(thinkingContent,thinkingAccum); }
                                } else { answerAccum += chunk; renderAssistantFinal(finalAnswerDiv,answerAccum); }
                                scrollToBottom();
                            }
                            if (parsed.conversation_id) conversationId = parsed.conversation_id;
                        } catch(e) { console.warn('解析失败', e, line); }
                    }
                }
            }
            if (inThink) stopTimer();
            if (!hasThinkTag) { messageDiv.remove(); createPlainAssistantMessage(fullText); }
            else { if (inThink && thinkingAccum) renderAssistantFinal(thinkingContent,thinkingAccum); if (answerAccum) renderAssistantFinal(finalAnswerDiv,answerAccum); stopTimer(); }
            scrollToBottom();
        }
        function createAssistantMessageContainer(){ /* 第一版逻辑 */ const div=document.createElement('div'); div.className='message assistant'; const bubble=document.createElement('div'); bubble.className='bubble'; div.appendChild(bubble); const thinkingBlock=document.createElement('div'); thinkingBlock.className='thinking-block'; const header=document.createElement('div'); header.className='thinking-header'; header.innerHTML='🧠 问题思考'; const timerSpan=document.createElement('span'); timerSpan.className='thinking-timer'; timerSpan.innerHTML='<span class="spinner"></span><span class="timer-text">0.0s</span>'; header.appendChild(timerSpan); const contentDiv=document.createElement('div'); contentDiv.className='thinking-content'; const finalDiv=document.createElement('div'); finalDiv.className='final-answer'; thinkingBlock.appendChild(header); thinkingBlock.appendChild(contentDiv); bubble.appendChild(thinkingBlock); bubble.appendChild(finalDiv); chatArea.appendChild(div); header.onclick=()=>contentDiv.classList.toggle('collapsed'); scrollToBottom(); return { thinkingContent:contentDiv, finalAnswerDiv:finalDiv, messageDiv:div, timerSpan }; }
        function createPlainAssistantMessage(content){ const div=document.createElement('div'); div.className='message assistant'; const bubble=document.createElement('div'); bubble.className='bubble'; renderAssistantFinal(bubble,content); div.appendChild(bubble); chatArea.appendChild(div); scrollToBottom(); return div; }
        function showUserMessage(content, attachmentsList){ const div=document.createElement('div'); div.className='message user'; let html='<div class="bubble">'; if(attachmentsList && attachmentsList.length) attachmentsList.forEach(att=>{ if(att.type==='image' && att.preview) html+=`<img src="${att.preview}" class="image-preview">`; else html+=`<div style="background:rgba(238,242,255,0.5); padding:6px 10px; border-radius:12px; margin-bottom:8px;">📄 ${escapeHtml(att.name)}</div>`; }); if(content) html+=`<div>${formatMessageFinal(content)}</div>`; html+='</div>'; div.innerHTML=html; chatArea.appendChild(div); scrollToBottom(); }
        async function sendMessageWithAttachment(text){ const q=text.trim(); if (!q && attachments.length===0) { showError('请输入文字或添加文件'); return; } showUserMessage(q, attachments); updateMessageCount(); const filesPayload = attachments.map(att => ({ type: att.type, transfer_method: "local_file", upload_file_id: att.fileId })); attachments = []; updateAttachmentsUI(); if (currentAbortController) currentAbortController.abort(); currentAbortController = new AbortController(); try { await callAndStreamWithThinking(q || "请分析这些文件", filesPayload, currentAbortController.signal); } catch (e) { if (e.name !== 'AbortError') showError(e.message); } finally { if (currentAbortController && !currentAbortController.signal.aborted) currentAbortController = null; updateMessageCount(); } }
        async function uploadAndAddAttachment(file){ if (!config.apiKey) { showError('请先配置 Dify API Key'); return false; } showError(`📎 上传中: ${file.name}`); try { const fd=new FormData(); fd.append('file',file,file.name); fd.append('user',currentUser?.username||'user'); const res=await fetch(`${config.apiEndpoint}/files/upload`,{method:'POST',headers:{'Authorization':`Bearer ${config.apiKey}`},body:fd}); if(!res.ok) throw new Error('上传失败'); const {id}=await res.json(); const type=file.type.startsWith('image/')?'image':'document'; let preview=null; if(type==='image'){ preview=await new Promise(resolve=>{ const reader=new FileReader(); reader.onload=e=>resolve(e.target.result); reader.readAsDataURL(file); }); } attachments.push({fileId:id,type,name:file.name,preview}); updateAttachmentsUI(); showError(`✅ 已添加: ${file.name}`); return true; } catch(err){ showError(`上传失败: ${err.message}`); return false; } }
        function updateAttachmentsUI(){ const container=document.getElementById('attachmentsContainer'); if(!container) return; if(attachments.length===0){ container.innerHTML=''; return; } let html='<div class="attachments-area">'; attachments.forEach((att,idx)=>{ const icon=att.type==='image'?'🖼️':'📄'; html+=`<div class="attachment-item" data-idx="${idx}">${icon} ${escapeHtml(att.name)}<button class="remove-attachment" data-idx="${idx}">✕</button></div>`; }); html+='</div>'; container.innerHTML=html; container.querySelectorAll('.remove-attachment').forEach(btn=>{ btn.addEventListener('click',(e)=>{ const idx=parseInt(btn.dataset.idx); if(!isNaN(idx)){ attachments.splice(idx,1); updateAttachmentsUI(); } }); }); }
        function bindBusinessButtons(){ document.querySelectorAll('.business-btn').forEach(btn=>btn.addEventListener('click',()=>{ const type=btn.getAttribute('data-type'); if(type) sendMessageWithAttachment(type); })); }
        function scrollToBottom(){ chatArea.scrollTop=chatArea.scrollHeight; }
        // === 新增功能：消息计数、清空对话、导出聊天记录 ===
        function updateMessageCount() {
            const messages = chatArea.querySelectorAll('.message');
            const countBar = document.getElementById('messageCountBar');
            if (countBar) {
                countBar.textContent = `共 ${messages.length} 条消息`;
            }
        }
        function clearChatHistory() {
            if (!confirm('确定要清空所有对话记录吗？此操作不可撤销。')) return;
            const messages = chatArea.querySelectorAll('.message');
            messages.forEach(msg => msg.remove());
            conversationId = '';
            updateMessageCount();
            showError('✅ 对话已清空');
        }
        function exportChatHistory() {
            const messages = chatArea.querySelectorAll('.message');
            if (messages.length === 0) { showError('当前没有对话记录可导出'); return; }
            let exportText = `小鲁班对话记录\n导出时间：${new Date().toLocaleString('zh-CN')}\n用户：${currentUser?.username || '未登录'}\n${'='.repeat(40)}\n\n`;
            messages.forEach(msg => {
                const isUser = msg.classList.contains('user');
                const role = isUser ? '我' : '小鲁班';
                const bubble = msg.querySelector('.bubble');
                if (!bubble) return;
                const text = bubble.innerText.trim();
                if (text) exportText += `[${role}]\n${text}\n\n`;
            });
            const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `小鲁班对话记录_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showError('✅ 对话记录已导出');
        }
        function showError(msg){ const d=document.createElement('div'); d.className='message assistant'; d.innerHTML=`<div class="bubble" style="background:#fee2e2; color:#b91c1c;">⚠️ ${escapeHtml(msg)}</div>`; chatArea.appendChild(d); scrollToBottom(); setTimeout(()=>d.remove(),5000); }
        function loadConfig(){ const k=localStorage.getItem('dify_api_key'), e=localStorage.getItem('dify_endpoint'), i=localStorage.getItem('dify_instructions'); if(k) config.apiKey=k; if(e) config.apiEndpoint=e; if(i) config.instructions=i; document.getElementById('apiKeyInput').value=config.apiKey; document.getElementById('apiEndpointInput').value=config.apiEndpoint; document.getElementById('customInstructions').value=config.instructions; }
        function saveConfig(){ config.apiKey=document.getElementById('apiKeyInput').value.trim(); config.apiEndpoint=document.getElementById('apiEndpointInput').value.trim().replace(/\/$/,''); config.instructions=document.getElementById('customInstructions').value.trim(); localStorage.setItem('dify_api_key',config.apiKey); localStorage.setItem('dify_endpoint',config.apiEndpoint); localStorage.setItem('dify_instructions',config.instructions); document.getElementById('settingsModal').style.display='none'; showError('✅ 配置已保存'); }
        function setChatBackground(url){ if(url){ chatArea.style.setProperty('--bg-image', `url('${url}')`); chatArea.classList.add('has-bg'); localStorage.setItem(`chat_background_${currentUser?.username||'default'}`, url); } else { chatArea.classList.remove('has-bg'); chatArea.style.removeProperty('--bg-image'); localStorage.removeItem(`chat_background_${currentUser?.username||'default'}`); } }
        function loadChatBackground(){ if(currentUser){ const bg=localStorage.getItem(`chat_background_${currentUser.username}`); if(bg) setChatBackground(bg); } }
        function initAttachmentContainer(){ const inputBar = document.querySelector('.input-bar'); const container = document.createElement('div'); container.id = 'attachmentsContainer'; inputBar.parentNode.insertBefore(container, inputBar); }
        initAttachmentContainer();
        // 事件绑定
        document.getElementById('sendBtn').onclick=()=>{ const m=textInput.value.trim(); if(m||attachments.length>0){ sendMessageWithAttachment(m); textInput.value=''; }else showError('请输入文字或添加文件'); };
        textInput.onkeypress=e=>{ if(e.key==='Enter') document.getElementById('sendBtn').click(); };
        document.getElementById('voiceBtn').onclick=()=>{ if(window.webkitSpeechRecognition){ let recog=new webkitSpeechRecognition(); recog.lang='zh-CN'; recog.start(); recog.onresult=e=>{ textInput.value=e.results[0][0].transcript; sendMessageWithAttachment(textInput.value); textInput.value=''; }; recog.onerror=()=>showError('语音识别失败'); } else showError('浏览器不支持语音'); };
        document.getElementById('plusBtn').onclick=e=>{ e.stopPropagation(); document.getElementById('plusMenu').classList.toggle('hidden'); };
        document.getElementById('cameraMenuBtn').onclick=()=>{ document.getElementById('plusMenu').classList.add('hidden'); const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment'; inp.onchange=async e=>{ const f=e.target.files[0]; if(f) await uploadAndAddAttachment(f); }; inp.click(); };
        document.getElementById('fileMenuBtn').onclick=()=>{ document.getElementById('plusMenu').classList.add('hidden'); const inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept='*/*'; inp.onchange=async e=>{ Array.from(e.target.files).forEach(f=>uploadAndAddAttachment(f)); }; inp.click(); };
        document.getElementById('qrMenuBtn').onclick=()=>{ alert('扫码功能需摄像头权限，请确保配置。'); };
        document.getElementById('openSettingsBtn').onclick=()=>document.getElementById('settingsModal').style.display='flex';
        document.getElementById('saveSettingsBtn').onclick=saveConfig;
        document.getElementById('closeModalBtn').onclick=()=>document.getElementById('settingsModal').style.display='none';
        document.getElementById('bgSettingsBtn').onclick=()=>{ document.getElementById('bgModal').style.display='flex'; const bg=localStorage.getItem(`chat_background_${currentUser?.username}`); if(bg) document.getElementById('bgPreview').style.backgroundImage=`url('${bg}')`; else document.getElementById('bgPreview').style.backgroundImage=''; };
        document.getElementById('closeBgBtn').onclick=()=>document.getElementById('bgModal').style.display='none';
        document.getElementById('setBgBtn').onclick=()=>{ const f=document.getElementById('bgImageInput').files[0]; if(f){ const reader=new FileReader(); reader.onload=e=>{ setChatBackground(e.target.result); document.getElementById('bgModal').style.display='none'; }; reader.readAsDataURL(f); } else showError('请选择图片'); };
        document.getElementById('removeBgBtn').onclick=()=>{ setChatBackground(null); document.getElementById('bgModal').style.display='none'; showError('已恢复默认背景'); };
        document.getElementById('userMenuBtn').onclick=showUserModal;
        document.getElementById('logoutBtn').onclick=()=>{ logout(); document.getElementById('userModal').style.display='none'; };
        document.getElementById('closeUserBtn').onclick=()=>document.getElementById('userModal').style.display='none';
        document.getElementById('reRequestPermBtn').onclick=()=>reRequestPermissions();
        document.getElementById('themeToggleBtn').onclick=showThemeModal;
        document.getElementById('clearChatBtn').onclick=clearChatHistory;
        document.getElementById('exportChatBtn').onclick=exportChatHistory;
        document.getElementById('authSubmitBtn').onclick=handleAuthSubmit;
        document.getElementById('authSwitchBtn').onclick=()=>{ isLoginMode=!isLoginMode; updateAuthUI(); document.getElementById('authError').textContent=''; };
        document.addEventListener('click',(e)=>{ const menu=document.getElementById('plusMenu'); if(menu && !menu.contains(e.target) && e.target!==document.getElementById('plusBtn')) menu.classList.add('hidden'); });
        initTheme();
        if(loadCurrentUser()){ updateUserUI(); loadConfig(); loadChatBackground(); updateMessageCount(); setTimeout(()=>{ requestAllPermissions(); bindBusinessButtons(); },500); } else showAuthModal();
    })();
    // ========== 自定义 Tooltip ==========
    (function() {
        const tip = document.createElement('div');
        tip.className = 'custom-tooltip';
        document.body.appendChild(tip);
        let hideTimer = null;
        function showTip(el, text) {
            clearTimeout(hideTimer);
            tip.textContent = text;
            const rect = el.getBoundingClientRect();
            tip.style.left = (rect.left + rect.width / 2 - tip.offsetWidth / 2) + 'px';
            tip.style.top = (rect.bottom + 6) + 'px';
            tip.classList.add('visible');
        }
        function hideTip() {
            hideTimer = setTimeout(() => tip.classList.remove('visible'), 150);
        }
        // 桌面端：鼠标悬浮显示 title
        document.querySelectorAll('[data-tip]').forEach(el => {
            el.addEventListener('mouseenter', () => showTip(el, el.dataset.tip));
            el.addEventListener('mouseleave', hideTip);
        });
        // 移动端：长按显示 title
        let longPressTimer = null;
        document.querySelectorAll('[data-tip]').forEach(el => {
            el.addEventListener('touchstart', (e) => {
                longPressTimer = setTimeout(() => showTip(el, el.dataset.tip), 400);
            }, { passive: true });
            el.addEventListener('touchend', () => { clearTimeout(longPressTimer); hideTip(); });
            el.addEventListener('touchcancel', () => { clearTimeout(longPressTimer); hideTip(); });
        });
    })();
</script>
